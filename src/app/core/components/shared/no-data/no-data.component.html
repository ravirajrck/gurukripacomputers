<div
  class="text-center py-20 text-slate-500 text-sm font-medium tracking-wide flex flex-col items-center justify-center space-y-4 flex-1 bg-white border border-slate-200/80 rounded-2xl shadow-sm w-full"
>
  <!-- Icon Container with Login-matching Blue Theme Accent -->
  <div
    class="w-16 h-16 rounded-2xl bg-blue-50/80 flex items-center justify-center border border-blue-100/60 text-blue-600 shadow-sm shadow-blue-500/10"
  >
    <svg
      class="w-8 h-8"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
      ></path>
    </svg>
  </div>

  <!-- Text & Heading -->
  <div class="space-y-1">
    <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider">
      {{ title }}
    </h3>
    <p class="text-xs font-medium text-slate-400">
      {{ subtitle }}
    </p>
  </div>
</div>
