<div class="space-y-6">
  
  <!-- Search & Action Bar -->
  <div *ngIf="showSearch || showHeaderButton" class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs">
    
    <!-- Search Input -->
    <div *ngIf="showSearch" class="flex items-center gap-3 w-full lg:w-auto flex-1">
      <div class="relative flex items-center w-full md:max-w-md group">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange($event)"
          [placeholder]="searchPlaceholder"
          class="w-full bg-slate-50/50 border border-slate-200 rounded-xl pl-11 pr-10 py-2 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all"
        />
        <div class="absolute left-4 text-slate-600 group-focus-within:text-blue-600 pointer-events-none">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <button
          *ngIf="searchTerm"
          class="absolute right-4 text-slate-600 hover:text-slate-800 font-medium text-lg cursor-pointer"
          (click)="clearSearch.emit()"
        >
          &times;
        </button>
      </div>
    </div>

    <!-- Header Action Button -->
    <a
      *ngIf="showHeaderButton && buttonRouterLink"
      [routerLink]="buttonRouterLink"
      class="px-4 py-2 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-medium text-sm tracking-wide rounded-xl transition-all duration-300 cursor-pointer inline-flex items-center gap-2 no-underline shadow-md shadow-blue-500/25 ml-auto"
    >
      <i class="fa-solid fa-plus text-[11px]"></i>
      <span>{{ buttonLabel }}</span>
    </a>
  </div>

  <!-- Table Container -->
  <div class="bg-white border border-slate-200/80 rounded-2xl shadow-2xs overflow-hidden">
    
    <!-- Header Count -->
    <div class="px-5 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center space-x-4">
      <h3 class="text-sm font-medium text-slate-800 uppercase tracking-wider">
        Total Records: <span class="text-blue-600 font-normal ml-1">{{ data.length }}</span>
      </h3>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-800 table-fixed min-w-[950px]">
        <thead>
          <tr class="border-b border-slate-100 font-medium uppercase text-slate-600 tracking-wider bg-slate-50/50 text-[11px] rounded-lg overflow-hidden">
            <th class="py-2.5 px-3 w-[6%] text-center rounded-l-lg font-medium">No.</th>
            
            <!-- Dynamic Columns Header -->
            <th 
              *ngFor="let col of columns" 
              class="py-2.5 px-4 font-medium"
              [style.width]="col.width || 'auto'"
              [ngClass]="{
                'text-center': col.align === 'center',
                'text-right': col.align === 'right',
                'text-left': !col.align || col.align === 'left'
              }"
            >
              {{ col.label }}
            </th>

            <th *ngIf="showActionsColumn" class="py-2.5 px-4 text-center rounded-r-lg font-medium" [style.width]="actionsWidth">
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          
          <!-- Skeleton Loader -->
          <ng-container *ngIf="loading">
            <tr *ngFor="let item of [1, 2, 3]" class="animate-pulse">
              <td [attr.colspan]="columns.length + (showActionsColumn ? 2 : 1)" class="py-3 px-3 text-center">
                <div class="h-5 bg-slate-100 rounded w-full"></div>
              </td>
            </tr>
          </ng-container>

          <!-- Table Rows -->
          <ng-container *ngIf="!loading">
            <tr *ngFor="let item of data; let i = index" class="hover:bg-slate-50/60 transition-colors">
              
              <!-- Index No. -->
              <td class="py-2 px-3 text-center">
                <span class="font-medium text-slate-600 font-mono text-[11px]">{{ i + 1 }}</span>
              </td>

              <!-- Dynamic Columns Data -->
              <td 
                *ngFor="let col of columns" 
                class="py-2 px-4"
                [ngClass]="{
                  'text-center': col.align === 'center',
                  'text-right': col.align === 'right'
                }"
              >
                <ng-container [ngSwitch]="col.type">
                  
                  <!-- Date Type -->
                  <span *ngSwitchCase="'date'" class="text-[11px] font-medium text-slate-600 font-mono">
                    {{ getNestedValue(item, col.key) | date:'dd MMM yyyy' }}
                  </span>

                  <!-- Currency Type -->
                  <span *ngSwitchCase="'currency'" class="font-mono font-medium text-slate-800 text-sm">
                    <i class="fa-solid fa-indian-rupee-sign text-[11px]"></i>{{ getNestedValue(item, col.key) }}
                  </span>

                  <!-- Status Dropdown Type -->
                  <div *ngSwitchCase="'status'" class="inline-block">
                    <select
                      [(ngModel)]="item[col.key]"
                      (change)="onStatusChange(item, item[col.key])"
                      class="text-[11px] font-medium px-2 py-1 rounded-md border transition-all cursor-pointer outline-none shadow-2xs capitalize"
                      [ngClass]="{
                        'bg-emerald-50/80 text-emerald-700 border-emerald-200': item[col.key] === 'paid' || item[col.key] === 'active',
                        'bg-amber-50/80 text-amber-700 border-amber-200': item[col.key] === 'pending',
                        'bg-rose-50/80 text-rose-700 border-rose-200': item[col.key] === 'overdue' || item[col.key] === 'inactive'
                      }"
                    >
                      <option value="paid">Paid</option>
                      <option value="pending">Pending</option>
                      <option value="overdue">Overdue</option>
                      <option value="active">Active</option>
                      <option value="inactive">Inactive</option>
                    </select>
                  </div>

                  <!-- Default Text Type -->
                  <span *ngSwitchDefault class="text-slate-800 text-sm font-medium">
                    {{ getNestedValue(item, col.key) }}
                  </span>

                </ng-container>
              </td>

              <!-- Actions Menu -->
              <td *ngIf="showActionsColumn" class="py-2 px-4 text-center">
                <button
                  [matMenuTriggerFor]="menu"
                  aria-label="Actions"
                  class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-blue-50 text-slate-500 hover:text-blue-600 border border-slate-200/80 hover:border-blue-200 inline-flex items-center justify-center transition-all duration-200 cursor-pointer shadow-2xs"
                >
                  <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                </button>

                <mat-menu #menu="matMenu" xPosition="before" class="custom-admin-menu">
                  <button
                    *ngFor="let act of actions"
                    mat-menu-item
                    (click)="triggerAction(act.action, item)"
                    class="!flex !items-center !gap-3 !px-3 text-xs !font-medium text-slate-700 hover:!bg-blue-50 hover:!text-blue-600 transition-colors group !h-9 !leading-none"
                    [ngClass]="act.colorClass || ''"
                  >
                    <mat-icon class="!text-slate-400 group-hover:!text-blue-600 !text-base !w-4 !h-4 !inline-flex !items-center !justify-center !m-0 transition-colors">
                      {{ act.icon }}
                    </mat-icon>
                    <span class="inline-flex items-center">{{ act.label }}</span>
                  </button>
                </mat-menu>
              </td>

            </tr>
          </ng-container>

          <!-- Empty State -->
          <tr *ngIf="!loading && data.length === 0">
            <td [attr.colspan]="columns.length + (showActionsColumn ? 2 : 1)" class="text-center py-12 text-slate-400 text-sm font-medium tracking-wider uppercase font-mono">
              No records found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
