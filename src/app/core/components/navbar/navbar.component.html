<header
  class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-blue-500/20 px-4 md:px-12 py-3 shadow-[0_4px_20px_rgba(37,99,235,0.03)] transition-all overflow-x-hidden"
>
  <!-- Loading Bar (AI Blue Theme) -->
  <div
    class="absolute bottom-0 left-0 h-[2.5px] bg-gradient-to-r from-blue-600 to-cyan-500 ease-out transition-all z-10 shadow-[0_0_8px_rgba(59,130,246,0.6)]"
    [class.duration-300]="isLoading"
    [class.duration-0]="!isLoading"
    [class.w-full]="isLoading"
    [class.w-0]="!isLoading"
  ></div>

  <div class="max-w-[1600px] mx-auto flex justify-between items-center w-full">
    <!-- Logo -->
    <a
      href="/"
      class="block w-[120px] md:w-[150px] cursor-pointer shrink-0"
      aria-label="Go to Home"
    >
      <img src="sidelogo.svg" alt="Logo" class="w-full h-auto drop-shadow-sm" />
    </a>

    <!-- Desktop Menu Container (Hidden on Mobile) -->
    <div class="hidden md:flex flex-col items-end space-y-2.5">
      <!-- Row 2: Navigation Links -->
      <div class="flex items-center gap-6 shrink-0">
        <!-- Home -->
        <a
          routerLink="/"
          [ngClass]="
            router.url === '/'
              ? 'text-blue-600 font-bold'
              : 'text-slate-600 font-semibold'
          "
          class="text-xs uppercase tracking-widest hover:text-blue-600 transition-all relative py-1 after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-blue-600 hover:after:w-full after:transition-all"
        >
          Home
        </a>

        <!-- Admin -->
        <!-- <a
          *ngIf="isLoggedIn$ | async"
          routerLink="/admin"
          [ngClass]="
            router.url.startsWith('/admin')
              ? 'text-blue-600 font-bold'
              : 'text-slate-600 font-semibold'
          "
          class="text-xs uppercase tracking-widest hover:text-blue-600 transition-all relative py-1 after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-blue-600 hover:after:w-full after:transition-all"
        >
          Admin
        </a> -->

        <!-- Store -->
        <a
          routerLink="/store"
          [ngClass]="
            router.url === '/store'
              ? 'text-blue-600 font-bold'
              : 'text-slate-600 font-semibold'
          "
          class="text-xs uppercase tracking-widest hover:text-blue-600 transition-all relative py-1 after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-blue-600 hover:after:w-full after:transition-all"
        >
          Store
        </a>

        <!-- Services -->
        <a
          routerLink="/services"
          [ngClass]="
            router.url.startsWith('/services')
              ? 'text-blue-600 font-bold'
              : 'text-slate-600 font-semibold'
          "
          class="text-xs uppercase tracking-widest hover:text-blue-600 transition-all relative py-1 after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-blue-600 hover:after:w-full after:transition-all"
        >
          Services
        </a>

        <!-- <div class="flex items-center gap-3 shrink-0"> -->
        <!-- SAVED Button -->
        <a
          routerLink="/store/saved"
          [ngClass]="
            router.url === '/store/saved'
              ? '!bg-blue-600 !text-white !border-blue-600 shadow-md shadow-blue-500/20'
              : 'text-blue-600 bg-blue-50/80 border-blue-200 hover:bg-blue-100 shadow-2xs'
          "
          class="flex items-center font-bold space-x-2 text-xs uppercase tracking-widest px-4 py-2 rounded-2xl border transition-all active:scale-95 cursor-pointer shrink-0"
        >
          <svg
            class="w-3.5 h-3.5"
            [ngClass]="
              router.url === '/store/saved' ? 'text-white' : 'text-blue-600'
            "
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
          <span>Saved</span>
        </a>

        <a
          *ngIf="isLoggedIn$ | async"
          routerLink="/admin"
          [ngClass]="
            router.url.startsWith('/admin')
              ? 'text-blue-600 font-bold'
              : 'text-slate-600 font-semibold'
          "
          class="flex items-center font-bold space-x-2 text-xs uppercase tracking-widest text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 px-4 py-2 rounded-2xl hover:shadow-xs transition-all cursor-pointer active:scale-95 shadow-2xs"
        >
          <span>ADMIN</span>
        </a>

        <!-- Logout Button -->
        <a
          *ngIf="isLoggedIn$ | async"
          (click)="onLogout()"
          class="flex items-center font-bold space-x-2 text-xs uppercase tracking-widest text-rose-600 bg-rose-50/80 border border-rose-200 px-4 py-2 rounded-2xl hover:bg-rose-100 hover:shadow-xs transition-all cursor-pointer active:scale-95 shadow-2xs"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            ></path>
          </svg>
          <span>Logout</span>
        </a>

        <!-- Login Button -->
        <a
          *ngIf="!(isLoggedIn$ | async)"
          routerLink="/admin-login"
          [ngClass]="
            router.url.startsWith('/admin-login')
              ? '!bg-blue-700 shadow-lg'
              : ''
          "
          class="text-xs uppercase font-bold tracking-widest text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 px-5 py-2.5 rounded-2xl shadow-md shadow-blue-500/20 hover:shadow-lg transition-all active:scale-95"
        >
          Login
        </a>
        <!-- </div> -->
      </div>
    </div>

    <!-- Mobile Menu Trigger -->
    <button
      (click)="sidebarService.toggle()"
      class="md:hidden p-2 text-blue-600 bg-blue-50 rounded-xl border border-blue-200 hover:bg-blue-100 transition-all cursor-pointer shadow-2xs shrink-0"
      aria-label="Toggle Menu"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
    </button>
  </div>
</header>
