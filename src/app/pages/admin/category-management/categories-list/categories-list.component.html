<div class="space-y-6">
<div
    class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs"
  >
    <!-- Search Bar (Left Side - Product List Style) -->
    <div class="w-full lg:w-1/2 flex items-center justify-start">
      <div class="relative flex items-center w-full md:max-w-md group">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterCategories()"
          placeholder="Search categories..."
          class="w-full bg-slate-50/50 border border-slate-200 rounded-xl pl-11 pr-10 py-2 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all"
        />
        <div
          class="absolute left-4 text-slate-400 group-focus-within:text-blue-600 pointer-events-none transition-colors"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <button
          *ngIf="searchTerm"
          (click)="clearSearch()"
          class="absolute right-4 text-slate-400 hover:text-slate-600 font-medium text-lg cursor-pointer transition-colors"
        >
          &times;
        </button>
      </div>
    </div>

    <!-- Add New Category Form (Right Side) -->
    <form (ngSubmit)="onSaveCategory()" class="w-full lg:w-1/2 flex flex-col sm:flex-row items-center justify-end gap-3">
      <div class="relative w-full group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 group-focus-within:text-blue-600 transition-colors">
          <i class="fa-solid fa-tag text-xs"></i>
        </span>
        <input
          type="text"
          [(ngModel)]="newCategoryName"
          name="catName"
          placeholder="e.g., Electronics, Fashion..."
          required
          class="w-full bg-slate-50/50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all shadow-2xs"
        />
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button
          type="submit"
          [disabled]="!newCategoryName?.trim()"
          class="w-full sm:w-auto px-4 py-2 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-medium text-sm tracking-wide rounded-xl transition-all duration-300 cursor-pointer inline-flex items-center justify-center gap-2 no-underline shadow-md shadow-blue-500/25 whitespace-nowrap disabled:opacity-50"
        >
          <i class="fa-solid fa-plus text-[11px]"></i>
          <span>Add Category</span>
        </button>
      </div>
    </form>
  </div>
  <!-- Categories Table -->
  <div
    class="bg-white border border-slate-200/80 rounded-2xl shadow-2xs overflow-hidden"
  >
    <div
      class="px-5 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center space-x-4"
    >
      <h3 class="text-sm font-medium text-slate-800 uppercase tracking-wider">
        Categories:
        <span class="text-blue-600 font-normal ml-1">{{ filteredCategories.length }}</span>
      </h3>
    </div>

    <div class="overflow-x-auto">
      <table
        class="w-full text-left text-sm text-slate-800 table-fixed min-w-[650px]"
      >
        <thead>
          <tr
            class="border-b border-slate-100 font-medium uppercase text-slate-600 tracking-wider bg-slate-50/50 text-[11px] rounded-lg overflow-hidden"
          >
            <th class="py-2.5 px-3 w-[10%] text-center rounded-l-lg font-medium">
              No.
            </th>
            <th class="py-2.5 px-4 w-[50%] font-medium">Category Name</th>
            <th class="py-2.5 px-4 w-[20%] text-center font-medium">
              Status
            </th>
            <th
              class="py-2.5 px-4 w-[20%] text-center rounded-r-lg font-medium"
            >
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr
            *ngFor="let cat of filteredCategories; let i = index"
            class="hover:bg-slate-50/60 transition-colors"
          >
            <td class="py-2.5 px-3 text-center align-middle">
              <span
                class="font-medium text-slate-600 font-mono text-[11px]"
                >{{ i + 1 }}</span
              >
            </td>

            <!-- Category Name Column (Normal view vs Inline Input) -->
            <td class="py-2.5 px-4 align-middle">
              <ng-container *ngIf="currentEditingCategoryId !== cat.id; else editInputTpl">
                <p class="font-medium text-slate-800 text-sm truncate">
                  {{ cat.name }}
                </p>
              </ng-container>
              <ng-template #editInputTpl>
                <input
                  type="text"
                  [(ngModel)]="tempEditCategoryName"
                  class="w-full bg-slate-50 border border-blue-500 rounded-xl px-3 py-1.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 shadow-2xs"
                  placeholder="Update category name..."
                />
              </ng-template>
            </td>

            <td class="py-2.5 px-4 text-center align-middle">
              <span
                *ngIf="cat.isDelete === false"
                class="text-[11px] font-medium px-2.5 py-1 rounded-md bg-amber-50/80 text-amber-700 border border-amber-200 inline-block"
              >
                Protected
              </span>
              <span
                *ngIf="cat.isDelete !== false"
                class="text-[11px] font-medium px-2.5 py-1 rounded-md bg-emerald-50/80 text-emerald-700 border border-emerald-200 inline-block"
              >
                Active
              </span>
            </td>

            <!-- Actions Column -->
            <td class="py-2.5 px-4 text-center align-middle">
              <!-- Normal Action Buttons -->
              <div class="flex items-center justify-center gap-2" *ngIf="currentEditingCategoryId !== cat.id && cat.isDelete !== false">
                <button
                  (click)="editCategory(cat)"
                  class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-blue-50 text-slate-500 hover:text-blue-600 border border-slate-200/80 hover:border-blue-200 inline-flex items-center justify-center transition-all duration-200 cursor-pointer shadow-2xs"
                  title="Edit Category"
                >
                  <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button
                  (click)="removeCategory(cat.id, cat.name)"
                  class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-rose-50 text-slate-500 hover:text-rose-600 border border-slate-200/80 hover:border-rose-200 inline-flex items-center justify-center transition-all duration-200 cursor-pointer shadow-2xs"
                  title="Delete Category"
                >
                  <i class="fa-solid fa-trash text-xs"></i>
                </button>
              </div>

              <!-- Inline Editing Save & Cancel Buttons -->
              <div class="flex items-center justify-center gap-1.5" *ngIf="currentEditingCategoryId === cat.id">
                <button
                  (click)="updateCategoryInline(cat.id)"
                  class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-medium text-xs inline-flex items-center gap-1.5 transition-all cursor-pointer shadow-md shadow-blue-500/20"
                  title="Save"
                >
                  <i class="fa-solid fa-check text-xs"></i>
                  <span>Save</span>
                </button>
                <button
                  (click)="cancelCategoryEdit()"
                  class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs inline-flex items-center gap-1.5 transition-all cursor-pointer"
                  title="Cancel"
                >
                  <i class="fa-solid fa-xmark text-xs"></i>
                </button>
              </div>

              <span *ngIf="currentEditingCategoryId !== cat.id && cat.isDelete === false" class="text-xs text-slate-400 font-mono">-</span>
            </td>
          </tr>

          <tr *ngIf="filteredCategories.length === 0">
            <td
              colspan="4"
              class="text-center py-12 text-slate-600 text-sm font-medium tracking-wider uppercase font-mono"
            >
              No categories found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
