<div class="space-y-6">
  
  <!-- Error Banner -->
  <div *ngIf="errorMessage" class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-2xl flex items-center justify-between text-xs font-semibold">
    <span>⚠️ {{ errorMessage }}</span>
    <button (click)="fetchStats()" class="underline hover:text-rose-900 cursor-pointer">Retry</button>
  </div>

  <!-- Dashboard Cards Grid -->
  <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-6">
    
    <!-- Total Products -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
      <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Products</h4>
      
      <!-- Actual Data -->
      <p *ngIf="!loadingData" class="text-3xl font-black text-slate-900 mt-2">
        {{ totalProductsCount }}
      </p>
      
      <!-- Shimmer Skeleton Loader -->
      <div *ngIf="loadingData" class="mt-3">
        <div class="h-8 w-16 bg-slate-200 rounded-lg animate-pulse"></div>
      </div>
    </div>

    <!-- Total Orders -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
      <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Orders</h4>
      
      <!-- Actual Data -->
      <p *ngIf="!loadingData" class="text-3xl font-black text-[#FF7620] mt-2">
        {{ totalOrdersCount }}
      </p>
      
      <!-- Shimmer Skeleton Loader -->
      <div *ngIf="loadingData" class="mt-3">
        <div class="h-8 w-16 bg-slate-200 rounded-lg animate-pulse"></div>
      </div>
    </div>

    <!-- Service Requests -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
      <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Service Requests</h4>
      
      <!-- Actual Data -->
      <p *ngIf="!loadingData" class="text-3xl font-black text-blue-600 mt-2">
        {{ totalServicesCount }}
      </p>
      
      <!-- Shimmer Skeleton Loader -->
      <div *ngIf="loadingData" class="mt-3">
        <div class="h-8 w-16 bg-slate-200 rounded-lg animate-pulse"></div>
      </div>
    </div>

    <!-- Total Categories -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
      <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Categories</h4>
      
      <!-- Actual Data -->
      <p *ngIf="!loadingData" class="text-3xl font-black text-emerald-600 mt-2">
        {{ totalCategoriesCount }}
      </p>
      
      <!-- Shimmer Skeleton Loader -->
      <div *ngIf="loadingData" class="mt-3">
        <div class="h-8 w-16 bg-slate-200 rounded-lg animate-pulse"></div>
      </div>
    </div>

  </div>
</div>
