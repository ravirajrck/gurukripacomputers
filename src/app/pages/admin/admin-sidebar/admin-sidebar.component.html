<aside
  class="bg-white border-r border-slate-200/80 flex flex-col justify-between h-full transition-all duration-300 select-none shrink-0"
  [ngClass]="isCollapsed ? 'w-20' : 'w-64'"
>
  <!-- Top Header: Brand Logo & Collapse Toggle -->
  <div
    class="flex items-center justify-between p-4 border-b border-slate-100 min-h-[73px]"
  >
    <!-- Brand Logo Area -->
    <a
      routerLink="/admin/dashboard"
      *ngIf="!isCollapsed"
      class="flex items-center gap-3 overflow-hidden no-underline group"
    >
      <!-- <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-500 flex items-center justify-center text-white font-medium text-xs shadow-md shadow-blue-500/25 shrink-0">
        RC
      </div> -->
      <a
        routerLink="/admin/dashboard"
        class="flex items-center gap-3 overflow-hidden no-underline group"
      >
        <div
          class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 overflow-hidden bg-white border border-slate-100 shadow-sm"
        >
          <img
            src="logo.svg"
            alt="RCK Logo"
            class="w-full h-full object-contain"
          />
        </div>
      </a>
      <div class="flex flex-col truncate">
        <span
          class="text-xs font-medium tracking-normal text-slate-800 leading-tight"
          >Guru Kripa Computer
        </span>
        <span
          class="text-[9px] font-medium text-blue-600 tracking-wider uppercase"
          >Admin</span
        >
      </div>
    </a>

    <!-- Single letter logo when collapsed -->
    <div *ngIf="isCollapsed" class="w-full flex justify-center">
      <a
        routerLink="/admin/dashboard"
        class="flex items-center gap-3 overflow-hidden no-underline group"
      >
        <div
          class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 overflow-hidden bg-white border border-slate-100 shadow-sm"
        >
          <img
            src="logo.svg"
            alt="RCK Logo"
            class="w-full h-full object-contain"
          />
        </div>
      </a>
    </div>

    <!-- Collapse Toggle Button -->
    <button
      (click)="toggleSidebar()"
      *ngIf="!isCollapsed"
      class="w-7 h-7 rounded-md bg-slate-50 hover:bg-blue-50 text-slate-400 hover:text-blue-600 border border-slate-200/80 hover:border-blue-200 flex items-center justify-center transition-all cursor-pointer shrink-0"
      title="Collapse Sidebar"
    >
      <i class="fa-solid fa-chevron-left text-[10px]"></i>
    </button>
  </div>

  <!-- Expand button centered when collapsed -->
  <div
    *ngIf="isCollapsed"
    class="px-2 py-3 border-b border-slate-100 flex justify-center"
  >
    <button
      (click)="toggleSidebar()"
      class="w-7 h-7 rounded-md bg-slate-50 hover:bg-blue-50 text-slate-400 hover:text-blue-600 border border-slate-200/80 hover:border-blue-200 flex items-center justify-center transition-all cursor-pointer"
      title="Expand Sidebar"
    >
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
    </button>
  </div>

  <!-- Navigation Links Section (Gradient Hover & Active State matching login button) -->
  <div
    class="flex-1 flex flex-col gap-1.5 p-3 overflow-y-auto overflow-x-hidden"
  >
    <div
      *ngIf="!isCollapsed"
      class="px-3 pt-2 pb-1 text-[10px] font-medium tracking-wider text-slate-400 uppercase"
    >
      Menu
    </div>

    <!-- Dashboard -->
    <a
      routerLink="/admin/dashboard"
      routerLinkActive="!bg-gradient-to-r !from-blue-600 !to-cyan-500 !text-white !shadow-lg !shadow-blue-500/25 active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3.5 px-3 py-3 rounded-xl text-[13px] tracking-normal text-slate-800 hover:bg-gradient-to-r hover:from-blue-50 hover:to-cyan-50/50 hover:text-blue-600 transition-all duration-300 cursor-pointer no-underline group relative"
      [title]="isCollapsed ? 'Dashboard' : ''"
    >
      <span class="w-5 text-center shrink-0 flex items-center justify-center">
        <i
          class="fa-solid fa-chart-pie text-sm text-slate-400 group-hover:text-blue-600 transition-colors"
        ></i>
      </span>
      <span *ngIf="!isCollapsed" class="truncate font-medium">Dashboard</span>
    </a>

    <!-- Products -->
    <a
      routerLink="/admin/products"
      routerLinkActive="!bg-gradient-to-r !from-blue-600 !to-cyan-500 !text-white !shadow-lg !shadow-blue-500/25 active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3.5 px-3 py-3 rounded-xl text-[13px] tracking-normal text-slate-800 hover:bg-gradient-to-r hover:from-blue-50 hover:to-cyan-50/50 hover:text-blue-600 transition-all duration-300 cursor-pointer no-underline group relative"
      [title]="isCollapsed ? 'Products' : ''"
    >
      <span class="w-5 text-center shrink-0 flex items-center justify-center">
        <i
          class="fa-solid fa-box-open text-sm text-slate-400 group-hover:text-blue-600 transition-colors"
        ></i>
      </span>
      <span *ngIf="!isCollapsed" class="truncate font-medium">Products</span>
    </a>

    <!-- Categories -->
    <a
      routerLink="/admin/categories"
      routerLinkActive="!bg-gradient-to-r !from-blue-600 !to-cyan-500 !text-white !shadow-lg !shadow-blue-500/25 active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3.5 px-3 py-3 rounded-xl text-[13px] tracking-normal text-slate-800 hover:bg-gradient-to-r hover:from-blue-50 hover:to-cyan-50/50 hover:text-blue-600 transition-all duration-300 cursor-pointer no-underline group relative"
      [title]="isCollapsed ? 'Categories' : ''"
    >
      <span class="w-5 text-center shrink-0 flex items-center justify-center">
        <i
          class="fa-solid fa-layer-group text-sm text-slate-400 group-hover:text-blue-600 transition-colors"
        ></i>
      </span>
      <span *ngIf="!isCollapsed" class="truncate font-medium">Categories</span>
    </a>

    <!-- Orders -->
    <a
      routerLink="/admin/orders"
      routerLinkActive="!bg-gradient-to-r !from-blue-600 !to-cyan-500 !text-white !shadow-lg !shadow-blue-500/25 active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3.5 px-3 py-3 rounded-xl text-[13px] tracking-normal text-slate-800 hover:bg-gradient-to-r hover:from-blue-50 hover:to-cyan-50/50 hover:text-blue-600 transition-all duration-300 cursor-pointer no-underline group relative"
      [title]="isCollapsed ? 'Orders' : ''"
    >
      <span class="w-5 text-center shrink-0 flex items-center justify-center">
        <i
          class="fa-solid fa-shopping-bag text-sm text-slate-400 group-hover:text-blue-600 transition-colors"
        ></i>
      </span>
      <span *ngIf="!isCollapsed" class="truncate font-medium">Orders</span>
    </a>

    <!-- Services -->
    <a
      routerLink="/admin/services"
      routerLinkActive="!bg-gradient-to-r !from-blue-600 !to-cyan-500 !text-white !shadow-lg !shadow-blue-500/25 active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3.5 px-3 py-3 rounded-xl text-[13px] tracking-normal text-slate-800 hover:bg-gradient-to-r hover:from-blue-50 hover:to-cyan-50/50 hover:text-blue-600 transition-all duration-300 cursor-pointer no-underline group relative"
      [title]="isCollapsed ? 'Services' : ''"
    >
      <span class="w-5 text-center shrink-0 flex items-center justify-center">
        <i
          class="fa-solid fa-screwdriver-wrench text-sm text-slate-400 group-hover:text-blue-600 transition-colors"
        ></i>
      </span>
      <span *ngIf="!isCollapsed" class="truncate font-medium">Services</span>
    </a>

    <!-- Invoices -->
    <a
      routerLink="/admin/invoices"
      routerLinkActive="!bg-gradient-to-r !from-blue-600 !to-cyan-500 !text-white !shadow-lg !shadow-blue-500/25 active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3.5 px-3 py-3 rounded-xl text-[13px] tracking-normal text-slate-800 hover:bg-gradient-to-r hover:from-blue-50 hover:to-cyan-50/50 hover:text-blue-600 transition-all duration-300 cursor-pointer no-underline group relative"
      [title]="isCollapsed ? 'Invoices' : ''"
    >
      <span class="w-5 text-center shrink-0 flex items-center justify-center">
        <i
          class="fa-solid fa-file-invoice-dollar text-sm text-slate-400 group-hover:text-blue-600 transition-colors"
        ></i>
      </span>
      <span *ngIf="!isCollapsed" class="truncate font-medium">Invoices</span>
    </a>
  </div>

  <!-- Footer Info / Copyright -->
  <div class="p-3 border-t border-slate-100 bg-slate-50/50">
    <div
      *ngIf="!isCollapsed"
      class="flex items-center justify-between text-[10px] text-slate-400 font-medium tracking-wide px-1"
    >
      <span>System Status</span>
      <span
        class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"
      ></span>
    </div>
  </div>
</aside>
