<div class="space-y-6">
  <!-- Search & Add Bar -->
  <div
    class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 glass-panel bg-white/60 p-5 rounded-2xl border border-slate-200 shadow-sm"
  >
    <div class="flex items-center gap-3 w-full lg:w-auto flex-1">
      <div class="relative flex items-center w-full md:max-w-md group">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          oninput="filterProducts()"
          (ngModelChange)="filterProducts()"
          placeholder="Search products..."
          class="w-full bg-white border border-slate-200 rounded-xl pl-11 pr-10 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#FF7620] focus:ring-1 focus:ring-[#FF7620] transition-all shadow-sm"
        />
        <div
          class="absolute left-4 text-slate-400 group-focus-within:text-[#FF7620] pointer-events-none"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <button
          *ngIf="searchTerm"
          (click)="clearSearch()"
          class="absolute right-4 text-slate-400 hover:text-[#FF7620] font-bold text-xl cursor-pointer"
        >
          &times;
        </button>
      </div>
    </div>

    <a
      [routerLink]="['/admin', 'manage-product']"
      class="px-6 py-3 bg-slate-900 hover:bg-[#FF7620] text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all cursor-pointer inline-flex items-center gap-2 no-underline shadow-sm"
    >
      <i class="fa-solid fa-plus"></i>
      <span>Add New Product</span>
    </a>
  </div>

  <!-- Products Table -->
  <div
    class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden"
  >
    <div
      class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex items-center space-x-6"
    >
      <h3
        class="text-sm font-semibold text-slate-900 uppercase tracking-widest"
      >
        Products:
        <span class="text-[#FF7620] text-lg font-semibold ml-1">{{
          filteredProducts.length
        }}</span>
      </h3>
    </div>

    <div class="overflow-x-auto">
      <table
        class="w-full text-left text-sm text-slate-600 table-fixed min-w-[850px]"
      >
        <thead>
          <tr
            class="border-b border-slate-100 text-xs font-semibold uppercase text-slate-400 tracking-widest bg-slate-50/50"
          >
            <th class="py-4 px-4 w-[6%] text-center">No.</th>
            <th class="py-4 px-6 w-[14%]">Image</th>
            <th class="py-4 px-6 w-[30%]">Product Details</th>
            <th class="py-4 px-6 w-[15%] text-center">Stock Status</th>
            <th class="py-4 px-6 w-[12%] text-right">Price</th>
            <th class="py-4 px-6 w-[23%] text-center">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <ng-container *ngIf="loadingData">
            <tr *ngFor="let item of [1, 2, 3]" class="animate-pulse">
              <td colspan="6" class="py-4 px-4 text-center">
                <div class="h-6 bg-slate-100 rounded w-full"></div>
              </td>
            </tr>
          </ng-container>

          <ng-container *ngIf="!loadingData">
            <tr
              *ngFor="let prod of filteredProducts; let i = index"
              class="hover:bg-slate-50 transition-colors"
            >
              <td class="py-4 px-4 text-center">
                <span class="font-bold text-slate-500 text-xs font-mono">{{
                  i + 1
                }}</span>
              </td>
              <td class="py-4 px-6">
                <div
                  class="w-16 h-16 rounded-xl overflow-hidden border border-slate-200 bg-slate-100"
                >
                  <img
                    [src]="prod?.images?.[0]?.url || 'assets/noimage.png'"
                    (error)="onImageError($event)"
                    class="w-full h-full object-cover"
                    alt="product"
                  />
                </div>
              </td>
              <td class="py-4 px-6">
                <p class="font-semibold text-slate-900 text-sm truncate">
                  {{ prod.name }}
                </p>
                <p class="text-xs text-slate-400 mt-1 truncate">
                  {{ prod.description || "No description provided." }}
                </p>
              </td>
              <td class="py-4 px-6 text-center">
                <select
                  [(ngModel)]="prod.inStock"
                  (change)="updateStockStatus(prod)"
                  class="text-xs font-bold px-3 py-1.5 rounded-lg border transition-all cursor-pointer outline-none shadow-sm"
                  [ngClass]="
                    prod.inStock !== false
                      ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                      : 'bg-rose-50 text-rose-700 border-rose-200'
                  "
                >
                  <option [ngValue]="true">In Stock</option>
                  <option [ngValue]="false">Out of Stock</option>
                </select>
              </td>
              <td class="py-4 px-6 text-right font-mono">
                <div class="flex flex-col items-end">
                  <span
                    class="text-sm text-slate-500 line-through font-medium"
                    *ngIf="prod.originalPrice"
                  >
                    <i class="fa-solid fa-indian-rupee-sign"></i
                    >{{ prod.originalPrice }}
                  </span>
                  <span class="text-[#FF7620] font-black text-base">
                    <i class="fa-solid fa-indian-rupee-sign"></i
                    >{{ prod.price }}
                  </span>
                </div>
              </td>
              <td class="py-4 px-6">
                <div class="flex justify-center space-x-1.5">
                  <button
                    (click)="viewProduct(prod.id)"
                    class="text-[10px] font-semibold bg-blue-50 hover:bg-blue-100 text-blue-600 px-2.5 py-2 rounded-lg uppercase cursor-pointer"
                  >
                    Details
                  </button>
                  <button
                    (click)="productEdit(prod)"
                    class="text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-2 rounded-lg uppercase cursor-pointer"
                  >
                    Edit
                  </button>
                  <button
                    (click)="removeProduct(prod.id, prod.name)"
                    class="text-[10px] font-semibold bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-2 rounded-lg uppercase cursor-pointer"
                  >
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          </ng-container>

          <tr *ngIf="!loadingData && filteredProducts.length === 0">
            <td
              colspan="6"
              class="text-center py-20 text-gray-500 text-base font-mono uppercase"
            >
              No products found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
