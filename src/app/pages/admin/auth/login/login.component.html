<!-- Parent Container (Clean Light Sci-Fi Vibe) -->
<div
  class="w-full min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-hidden"
>
  <!-- Subtle Light AI Blue Ambient Glow Effects -->
  <div
    class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] bg-blue-500/5 rounded-full blur-[100px] pointer-events-none"
  ></div>
  <div
    class="absolute -bottom-20 -right-20 w-80 h-80 bg-cyan-400/5 rounded-full blur-[80px] pointer-events-none"
  ></div>

  <!-- CLEAN LIGHT FUTURISTIC CARD -->
  <div
    class="bg-white/90 backdrop-blur-xl w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-[0_10px_30px_rgba(0,0,0,0.05)] border border-blue-500/15 relative z-10 transition-all duration-300"
  >
    <!-- BRAND / LOGO AREA -->
    <div class="text-center mb-6">
      <!-- Logo Container with Subtle Tech Border -->
      <div class="inline-flex items-center justify-center">
        <a href="/" class="block w-[80px] cursor-pointer">
          <img src="logo.svg" alt="Logo" class="w-full h-auto" />
        </a>
      </div>
      <h2
        class="text-xl sm:text-2xl font-black text-slate-900 uppercase tracking-wider flex items-center justify-center gap-2"
      >
        <!-- <span class="inline-block w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span> -->
        Admin Portal
      </h2>
      <p
        class="text-xs font-semibold text-blue-600/70 mt-1 uppercase tracking-widest"
      >
        AI Ecosystem Interface
      </p>
    </div>

    <!-- FORM INTERFACE -->
    <form (ngSubmit)="onLogin()" class="space-y-4">
      <!-- EMAIL -->
      <div>
        <label
          class="text-[11px] font-bold text-slate-500 uppercase tracking-widest block mb-1.5 flex items-center gap-1.5"
        >
          <i class="fa-solid fa-envelope text-blue-600"></i> Email Address
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@rckdigitech.in"
          required
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-sm"
        />
      </div>

      <!-- PASSWORD -->
      <div>
        <label
          class="text-[11px] font-bold text-slate-500 uppercase tracking-widest block mb-1.5 flex items-center gap-1.5"
        >
          <i class="fa-solid fa-lock text-blue-600"></i> Password
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-sm"
        />
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        [disabled]="isLoading"
        [class.opacity-50]="isLoading"
        class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-black uppercase text-xs sm:text-sm tracking-widest py-3.5 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:from-blue-700 hover:to-cyan-600 active:scale-[0.98] transition-all duration-300 flex items-center justify-center cursor-pointer mt-3"
      >
        <span *ngIf="isLoading" class="flex items-center justify-center">
          <svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v8H4z"
            ></path>
          </svg>
          Authenticating...
        </span>
        <span *ngIf="!isLoading">Login</span>
      </button>
    </form>
  </div>

  <!-- Futuristic Light Footer Info -->
  <div class="mt-6 text-center relative z-10">
    <p class="text-[10px] font-mono text-slate-400 tracking-widest uppercase">
      System Version 1.0 • Online
    </p>
  </div>
</div>
