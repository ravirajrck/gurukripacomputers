<!-- Parent Container (Simple & Clean Layout) -->
<div class="w-full min-h-screen bg-slate-50 flex flex-col items-center justify-start pt-8 sm:pt-16 px-4 pb-12">
  
  <!-- PREMIUM WHITE CARD -->
  <div class="bg-white w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-xl">
    
    <!-- BRAND / LOGO AREA -->
    <div class="text-center mb-6">
      <!-- Logo -->
      <div class="flex flex-col items-center justify-center mb-4">
        <a href="/" class="block w-[90px] cursor-pointer">
          <img src="SANATAN3LOGO.svg" alt="Logo" class="w-full h-auto" />
        </a>
      </div>
      <h2 class="text-xl sm:text-2xl font-semibold text-slate-900 uppercase tracking-tight">
        Admin Login
      </h2>
      <p class="text-xs sm:text-sm font-medium text-slate-500 mt-1">Manage your digital ecosystem</p>
    </div>

    <!-- FORM INTERFACE -->
    <form (ngSubmit)="onLogin()" class="space-y-4">
      <!-- EMAIL -->
      <div>
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest block mb-1.5">
          Email Address
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@rckdigitech.in"
          required
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#FF7620] focus:ring-2 focus:ring-[#FF7620]/10 text-slate-900 transition-all"
        />
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest block mb-1.5">
          Password
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#FF7620] focus:ring-2 focus:ring-[#FF7620]/10 text-slate-900 transition-all"
        />
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        [disabled]="isLoading"
        [class.opacity-50]="isLoading"
        class="w-full bg-[#FF7620] text-white font-black uppercase text-sm sm:text-base tracking-widest py-3.5 rounded-xl shadow-lg shadow-orange-100 hover:bg-orange-600 transition-all duration-300 flex items-center justify-center cursor-pointer mt-2"
      >
        <span *ngIf="isLoading" class="flex items-center justify-center">
          <svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Logging In...
        </span>
        <span *ngIf="!isLoading">LogIn</span>
      </button>
    </form>
    
  </div>
</div>
