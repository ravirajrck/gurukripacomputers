<main class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-8 flex-1 flex flex-col relative z-10">
  
  <!-- Page Header -->
  <div class="mb-6 sm:mb-8 bg-white border border-slate-200/80 p-6 sm:p-8 rounded-3xl shadow-sm">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-[#FF7620] animate-pulse"></span>
      <span class="text-[11px] font-black uppercase tracking-widest text-[#FF7620]">Management Portal</span>
    </div>
    <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight uppercase mt-1">
      Admin Dashboard
    </h1>
    <p class="text-xs sm:text-sm font-medium text-slate-500 mt-1">
      Seamlessly manage store operations, inventory, categories, orders, and service requests from one place.
    </p>
  </div>

  <!-- Main Grid Layout: Left Sidebar Navigation & Right Content Area -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
    
    <!-- Left Side Navigation List (Takes 3 Columns on Desktop, Normal flow on Mobile) -->
    <aside class="w-full lg:col-span-3 bg-white border border-slate-200/80 p-3 rounded-3xl shadow-sm flex flex-col gap-1.5 lg:sticky lg:top-6 relative z-0">
      <div class="px-4 py-2 text-[10px] font-black uppercase tracking-widest text-slate-400">
        Navigation Menu
      </div>
      
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-slate-900 text-white shadow-md shadow-slate-900/10 font-bold"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl text-xs uppercase tracking-wider text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 transition-all cursor-pointer no-underline group"
      >
        <i class="fa-solid fa-chart-pie text-sm group-hover:text-[#FF7620] transition-colors"></i>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/admin/products"
        routerLinkActive="bg-slate-900 text-white shadow-md shadow-slate-900/10 font-bold"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl text-xs uppercase tracking-wider text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 transition-all cursor-pointer no-underline group"
      >
        <i class="fa-solid fa-box-open text-sm group-hover:text-[#FF7620] transition-colors"></i>
        <span>Products</span>
      </a>

      <a
        routerLink="/admin/categories"
        routerLinkActive="bg-slate-900 text-white shadow-md shadow-slate-900/10 font-bold"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl text-xs uppercase tracking-wider text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 transition-all cursor-pointer no-underline group"
      >
        <i class="fa-solid fa-layer-group text-sm group-hover:text-[#FF7620] transition-colors"></i>
        <span>Categories</span>
      </a>

      <a
        routerLink="/admin/orders"
        routerLinkActive="bg-slate-900 text-white shadow-md shadow-slate-900/10 font-bold"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl text-xs uppercase tracking-wider text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 transition-all cursor-pointer no-underline group"
      >
        <i class="fa-solid fa-shopping-bag text-sm group-hover:text-[#FF7620] transition-colors"></i>
        <span>Orders</span>
      </a>

      <a
        routerLink="/admin/services"
        routerLinkActive="bg-slate-900 text-white shadow-md shadow-slate-900/10 font-bold"
        class="flex items-center gap-3 px-4 py-3 rounded-2xl text-xs uppercase tracking-wider text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 transition-all cursor-pointer no-underline group"
      >
        <i class="fa-solid fa-screwdriver-wrench text-sm group-hover:text-[#FF7620] transition-colors"></i>
        <span>Services</span>
      </a>
    </aside>

    <!-- Right Side Dynamic Content View Container (Takes 9 Columns) -->
    <div class="w-full lg:col-span-9 relative z-0">
      <router-outlet></router-outlet>
    </div>

  </div>
</main>
