<main
  class="w-full h-full mx-auto flex flex-row relative z-10 overflow-hidden bg-slate-50/50"
>
  <!-- Admin Sidebar Component -->
  <app-admin-sidebar class="h-full flex shrink-0"></app-admin-sidebar>

  <!-- Right Side: Main Content Area -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <!-- Top Header inside Admin Area (Matching Thin Fonts, Gradient Touch & Clean Borders) -->
    <header
      class="flex items-center justify-between gap-4 px-6 py-4 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-[0_2px_15px_rgba(37,99,235,0.02)] w-full m-0 rounded-none shrink-0"
    >
      <div>
        <div class="flex items-center gap-3">
      <h1 class="text-lg md:text-xl font-semibold tracking-normal text-slate-800 uppercase">
  {{ pageTitle }}
</h1>
          <!-- <span
            class="px-2.5 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-semibold uppercase tracking-wider rounded-md border border-blue-100 shadow-2xs"
            >Control Center</span
          > -->
        </div>
        <!-- <p class="text-xs font-normal text-slate-500 mt-0.5">
          Seamlessly manage store operations, products, categories, orders & services from your desktop.
        </p> -->
      </div>

      <!-- Back to Store Action Button (Matching Login Button Gradient Style) -->
      <div class="flex items-center gap-3 shrink-0">
        <a
          routerLink="/store"
          [ngClass]="
            router.url.startsWith('/admin')
              ? 'text-blue-600 font-bold'
              : 'text-slate-600 font-semibold'
          "
          class="flex items-center font-bold space-x-2 text-xs uppercase tracking-widest text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 px-4 py-2 rounded-2xl hover:shadow-xs transition-all cursor-pointer active:scale-95 shadow-2xs"
        >
          <span>STORE</span>
        </a>

        <!-- Logout Button -->
        <a
          *ngIf="isLoggedIn$ | async"
          (click)="onLogout()"
          class="flex items-center font-bold space-x-2 text-xs uppercase tracking-widest text-rose-600 bg-rose-50/80 border border-rose-200 px-4 py-2 rounded-2xl hover:bg-rose-100 hover:shadow-xs transition-all cursor-pointer active:scale-95 shadow-2xs"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            ></path>
          </svg>
          <span>Logout</span>
        </a>
      </div>
    </header>

    <!-- Dynamic Router Outlet for Sub-Pages (Products, Orders, etc. - Scrollable Workspace) -->
    <div class="w-full flex-1 relative z-0 p-6 overflow-y-auto bg-slate-50/30">
      <router-outlet></router-outlet>
    </div>
  </div>
</main>
