<div class="max-w-5xl mx-auto px-6 py-12">
  <div class="grid md:grid-cols-2 gap-12 items-start">
    <!-- LEFT SIDE: Contact Info -->
    <div class="space-y-8">
      <div>
        <h1 class="text-4xl font-black uppercase tracking-tight mb-2 text-slate-900 border-l-4 border-blue-600 pl-4">
          Contact <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">Us</span>
        </h1>
        <p class="text-slate-500">
          We are here to help you with your tech requirements. Reach out to us
          for any enquiry.
        </p>
      </div>

      <div class="space-y-6">
        <a
          [href]="'tel:' + siteData?.phone"
          class="flex items-center gap-4 group p-3 rounded-2xl transition-all hover:bg-blue-50/50 border border-transparent hover:border-blue-100"
        >
          <div
            class="w-12 h-12 flex items-center justify-center bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-all shadow-xs"
          >
            <i class="fa-solid fa-phone text-sm"></i>
          </div>
          <div>
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Call Us</p>
            <p class="font-bold text-slate-900 group-hover:text-blue-600 transition-colors">{{ siteData?.phone }}</p>
          </div>
        </a>

        <a
          [href]="'mailto:' + siteData?.email"
          class="flex items-center gap-4 group p-3 rounded-2xl transition-all hover:bg-blue-50/50 border border-transparent hover:border-blue-100"
        >
          <div
            class="w-12 h-12 flex items-center justify-center bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-all shadow-xs"
          >
            <i class="fa-regular fa-envelope text-sm"></i>
          </div>
          <div>
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Email Us</p>
            <p class="font-bold text-slate-900 group-hover:text-blue-600 transition-colors">{{ siteData?.email }}</p>
          </div>
        </a>
      </div>

      <div class="p-6 bg-slate-950 text-white rounded-3xl border border-blue-500/20 shadow-xl relative overflow-hidden">
        <div class="absolute bottom-0 right-0 w-32 h-32 bg-blue-600/10 rounded-full blur-2xl pointer-events-none"></div>
        <p class="text-xs font-bold uppercase tracking-widest text-blue-400 mb-2 flex items-center gap-2">
          <i class="fa-solid fa-location-dot"></i> Store Location
        </p>
        <p class="font-medium text-sm leading-relaxed text-slate-300">
          {{ siteData?.address }}
        </p>
      </div>
    </div>

    <!-- RIGHT SIDE: Simple Form -->
    <div class="bg-white p-8 rounded-3xl border border-blue-500/15 shadow-[0_10px_30px_rgba(37,99,235,0.04)] relative">
      <h2 class="text-xl font-black uppercase tracking-tight mb-6 text-slate-900 flex items-center justify-between">
        <span>Enquiry Form</span>
        <span class="w-8 h-1 bg-blue-600 rounded-full"></span>
      </h2>

      <!-- ACTION ME APNI FORMSPREE ID DALNI HAI -->
      <form
        action="https://formspree.io/f/YOUR_FORM_ID"
        method="POST"
        class="space-y-4"
      >
        <div>
          <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all"
          />
        </div>
        <div>
          <input
            type="text"
            name="phone"
            placeholder="Your Contact Number"
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all"
          />
        </div>
        <div>
          <textarea
            name="message"
            rows="3"
            placeholder="How can we help?"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all resize-none"
          ></textarea>
        </div>
        <button
          type="submit"
          class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-bold py-4 rounded-xl cursor-pointer shadow-md shadow-blue-500/20 hover:shadow-lg transition-all active:scale-95"
        >
          Send Enquiry
        </button>
      </form>
    </div>
  </div>
</div>
