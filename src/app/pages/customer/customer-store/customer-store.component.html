<main
  class="max-w-[1600px] w-full mx-auto px-6 py-8 flex-1 flex flex-col relative z-10"
>
  <!-- Header & Search Bar -->
  <div
    class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10 bg-cyber-card p-1 rounded-2xl"
  >
    <div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-wider uppercase">
        Explore Catalog
      </h1>
      <p class="text-sm font-medium text-slate-500 mt-1">
        Explore our latest arrivals and exclusive collections today.
      </p>
    </div>

    <div class="relative flex items-center w-full md:max-w-md group">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        name="custSearch"
        placeholder="Search products..."
        class="w-full bg-white border border-slate-200 rounded-xl pl-11 pr-10 py-3.5 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#FF7620] focus:ring-1 focus:ring-[#FF7620] transition-all duration-300 shadow-sm"
      />

      <!-- Icon -->
      <div
        class="absolute left-4 text-slate-400 group-focus-within:text-[#FF7620] transition-colors duration-300 pointer-events-none"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
      </div>

      <!-- Clear Button -->
      <button
        type="button"
        *ngIf="searchQuery"
        (click)="searchQuery = ''"
        class="absolute right-4 text-slate-400 hover:text-[#FF7620] transition-colors font-bold text-xl cursor-pointer"
      >
        &times;
      </button>
    </div>
  </div>

  <!-- Category Popup Dropdown Filter -->
  <div class="relative mb-8 inline-block" #categoryDropdownContainer>
    <!-- Toggle Button -->
    <button
      type="button"
      (click)="isCategoryDropdownOpen = !isCategoryDropdownOpen"
      class="px-5 py-3 bg-white border border-slate-200 hover:border-[#FF7620] text-slate-700 hover:text-[#FF7620] rounded-xl text-sm font-bold tracking-wide uppercase transition-all duration-300 cursor-pointer inline-flex items-center gap-3 shadow-sm"
    >
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-filter text-[#FF7620]"></i>
        Category:
        <span class="text-[#FF7620]">
          {{ selectedCategory === 'all' ? 'All Categories' : getSelectedCategoryName() }}
        </span>
      </span>
      <i class="fa-solid fa-chevron-down text-xs transition-transform duration-300" [ngClass]="{'rotate-180': isCategoryDropdownOpen}"></i>
    </button>

    <!-- Popup Dropdown List -->
    <div
      *ngIf="isCategoryDropdownOpen"
      class="absolute left-0 mt-2 w-72 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 overflow-hidden py-2 animate-in fade-in slide-in-from-top-2 duration-200"
    >
      <div class="max-h-64 overflow-y-auto px-2 space-y-1 custom-scrollbar">
        <!-- All Items Option -->
        <button
          type="button"
          (click)="selectedCategory = 'all'; isCategoryDropdownOpen = false"
          class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition-all cursor-pointer flex items-center justify-between"
          [ngClass]="
            selectedCategory === 'all'
              ? 'bg-[#FF7620] text-white shadow-sm'
              : 'text-slate-600 hover:bg-slate-50 hover:text-[#FF7620]'
          "
        >
          <span>All Categories</span>
          <i *ngIf="selectedCategory === 'all'" class="fa-solid fa-check text-xs"></i>
        </button>

        <!-- Category Options -->
        <button
          type="button"
          *ngFor="let cat of categoriesList"
          (click)="selectedCategory = cat.id; isCategoryDropdownOpen = false"
          class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-semibold uppercase tracking-wider transition-all cursor-pointer flex items-center justify-between"
          [ngClass]="
            selectedCategory === cat.id
              ? 'bg-[#FF7620] text-white shadow-sm'
              : 'text-slate-600 hover:bg-slate-50 hover:text-[#FF7620]'
          "
        >
          <span class="truncate pr-2">{{ cat.name }}</span>
          <i *ngIf="selectedCategory === cat.id" class="fa-solid fa-check text-xs shrink-0"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State (Single Clean Grid) -->
  <div
    *ngIf="isLoading"
    class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3 sm:gap-5"
  >
    <div
      *ngFor="let placeholder of [1, 2, 3, 4, 5, 6]"
      class="bg-white border border-slate-100 rounded-2xl p-4 overflow-hidden space-y-4 animate-pulse shadow-sm"
    >
      <div class="aspect-square w-full bg-slate-200 rounded-xl"></div>
      <div class="h-4 bg-slate-200 rounded w-2/3"></div>
      <div class="h-3 bg-slate-100 rounded w-full"></div>
      <div class="flex justify-between items-center pt-2">
        <div class="h-5 bg-slate-200 rounded w-1/4"></div>
        <div class="h-7 bg-slate-200 rounded w-1/3"></div>
      </div>
    </div>
  </div>

  <!-- Products Grid -->
  <div
    *ngIf="!isLoading && filteredProducts.length > 0"
    class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3 sm:gap-5 flex-1"
  >
    <div *ngFor="let prod of filteredProducts" class="h-full">
      <app-product-card
        [product]="prod"
        [saved]="isSaved(prod.id)"
        (cardClick)="viewProduct($event)"
        (toggleSaved)="toggleSaved($event.product, $event.event)"
        (buyNow)="onOrderNow($event)"
      ></app-product-card>
    </div>
  </div>

  <!-- No Data State -->
  <app-no-data
    *ngIf="!isLoading && filteredProducts.length === 0"
    title="No Products Found"
    subtitle="Try adjusting your search or category filter."
  >
  </app-no-data>
</main>
