  <!-- Services & Problem Solving Section (Updated with Store/Product Page Blue Theme) -->
  <div class="mt-0">
    <!-- Header & Search Bar (Matched with Products Catalog Design) -->
    <div
      class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 bg-white/80 backdrop-blur-xl px-6 py-5 rounded-2xl border border-slate-200/80 shadow-[0_4px_20px_rgba(0,0,0,0.02)] relative z-10"
    >
      <div>
        <h1
          class="text-xl font-bold text-slate-800 tracking-tight flex items-center gap-2.5"
        >
          <span>Our Services</span>
        </h1>
        <p class="text-xs font-normal text-slate-500 mt-0.5">
          Got any issue? We fix everything related to below.
        </p>
      </div>
    </div>

    <div class="w-full relative z-30">
      <!-- Loader / Shimmer -->
      <div
        *ngIf="loading"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 sm:gap-8 animate-pulse"
      >
        <div
          *ngFor="let i of [1, 2, 3, 4]"
          class="bg-white border border-slate-200/80 p-6 sm:p-8 rounded-2xl h-60 shadow-sm"
        ></div>
      </div>

      <!-- Services Cards Grid -->
      <div
        *ngIf="!loading"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5 sm:gap-8"
      >
        <div
          *ngFor="let service of servicesList"
          class="bg-white border border-slate-200/80 p-5 sm:p-8 rounded-2xl shadow-sm hover:shadow-xl hover:border-blue-600 transition-all duration-300 flex flex-col justify-between group relative overflow-hidden"
        >
          <!-- Top decorative highlight -->
          <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-600/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>

          <div>
            <div
              class="w-12 h-12 sm:w-14 sm:h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl sm:text-2xl font-bold mb-4 sm:mb-6 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shadow-sm border border-blue-500/20"
            >
              <i [ngClass]="service.icon || 'fa-solid fa-video'"></i>
            </div>
            <h3
              class="text-lg font-bold text-slate-900 mb-2 sm:mb-3 tracking-wide group-hover:text-blue-600 transition-colors"
            >
              {{ service.title }}
            </h3>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
              {{ service.description }}
            </p>
          </div>

          <div
            class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3"
          >
            <button
              type="button"
              (click)="openInquiryModal(service)"
              class="px-4 py-2.5 bg-slate-900 hover:bg-blue-600 text-white font-bold text-[11px] sm:text-xs uppercase tracking-wider rounded-xl transition-all duration-300 cursor-pointer shadow-md border shrink-0"
            >
              Book Service
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>


</main>
