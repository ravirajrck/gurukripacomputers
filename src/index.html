<body class="mat-typography">
<app-root>
  <!-- Yeh content tab tak dikhega jab tak Angular load nahi hota -->
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #ffffff;">
    <div style="text-align: center;">
      <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #FF7620; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 10px; font-family: sans-serif; font-size: 14px; color: #333; font-weight: bold;">Loading...</p>
    </div>
  </div>
</app-root>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
